services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ledger
      POSTGRES_USER: ledger
      POSTGRES_DB: ledger
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
